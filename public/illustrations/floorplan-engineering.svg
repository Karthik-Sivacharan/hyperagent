    <rect class="fp-tint" x="1250" y="56" width="70" height="26"/>
    <rect class="fp-tint" x="1330" y="56" width="70" height="26"/>
    <!-- long table -->
    <rect class="fp-solid" x="1170" y="132" width="224" height="76" rx="8"/>
    <!-- chairs -->
    <rect class="fp-solid" x="1192" y="96" width="44" height="32" rx="7"/>
    <rect class="fp-solid" x="1258" y="96" width="44" height="32" rx="7"/>
    <rect class="fp-solid" x="1324" y="96" width="44" height="32" rx="7"/>
    <rect class="fp-solid" x="1192" y="212" width="44" height="32" rx="7"/>
    <rect class="fp-solid" x="1258" y="212" width="44" height="32" rx="7"/>
    <rect class="fp-solid" x="1324" y="212" width="44" height="32" rx="7"/>
    <!-- side console -->
    <rect class="fp-solid" x="1146" y="252" width="90" height="34" rx="3"/>
    <path class="fp-thin" d="M1146 270h90"/>
