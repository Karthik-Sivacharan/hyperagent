    <rect class="fp-floor" x="442" y="44" width="682" height="390"/>
    <!-- supply cabinet -->
    <rect class="fp-solid" x="452" y="90" width="40" height="110" rx="2"/>
    <path class="fp-thin" d="M452 126h40M452 162h40"/>
    <!-- whiteboard on the outer wall -->
    <rect class="fp-tint" x="1020" y="52" width="90" height="18"/>
    <!-- pod A -->
    <rect class="fp-solid" x="520" y="128" width="200" height="56" rx="3"/>
    <rect class="fp-solid" x="526" y="184" width="188" height="24" rx="2"/>
    <rect class="fp-solid" x="520" y="208" width="200" height="56" rx="3"/>
    <path class="fp-line" d="M620 128v56M620 208v56"/>
    <rect class="fp-tint" x="540" y="140" width="54" height="22" rx="2"/>
    <rect class="fp-tint" x="640" y="140" width="54" height="22" rx="2"/>
    <rect class="fp-tint" x="540" y="230" width="54" height="22" rx="2"/>
    <rect class="fp-tint" x="640" y="230" width="54" height="22" rx="2"/>
    <rect class="fp-solid" x="548" y="88" width="44" height="34" rx="7"/>
    <rect class="fp-solid" x="648" y="88" width="44" height="34" rx="7"/>
    <rect class="fp-solid" x="548" y="270" width="44" height="34" rx="7"/>
    <rect class="fp-solid" x="648" y="270" width="44" height="34" rx="7"/>
    <!-- pod B -->
    <rect class="fp-solid" x="800" y="128" width="200" height="56" rx="3"/>
    <rect class="fp-solid" x="806" y="184" width="188" height="24" rx="2"/>
    <rect class="fp-solid" x="800" y="208" width="200" height="56" rx="3"/>
    <path class="fp-line" d="M900 128v56M900 208v56"/>
    <rect class="fp-tint" x="820" y="140" width="54" height="22" rx="2"/>
    <rect class="fp-tint" x="920" y="140" width="54" height="22" rx="2"/>
    <rect class="fp-tint" x="820" y="230" width="54" height="22" rx="2"/>
    <rect class="fp-tint" x="920" y="230" width="54" height="22" rx="2"/>
    <rect class="fp-solid" x="828" y="88" width="44" height="34" rx="7"/>
    <rect class="fp-solid" x="928" y="88" width="44" height="34" rx="7"/>
    <rect class="fp-solid" x="828" y="270" width="44" height="34" rx="7"/>
    <rect class="fp-solid" x="928" y="270" width="44" height="34" rx="7"/>
    <!-- printer station -->
