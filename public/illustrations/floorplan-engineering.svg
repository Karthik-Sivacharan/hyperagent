    <rect class="fp-floor" x="442" y="434" width="682" height="382"/>
    <!-- low partition runs -->
    <rect class="fp-solid" x="466" y="440" width="290" height="14" rx="4"/>
    <rect class="fp-solid" x="816" y="440" width="290" height="14" rx="4"/>
    <!-- pod C -->
    <rect class="fp-solid" x="520" y="500" width="200" height="56" rx="3"/>
    <rect class="fp-solid" x="526" y="556" width="188" height="24" rx="2"/>
    <rect class="fp-solid" x="520" y="580" width="200" height="56" rx="3"/>
    <path class="fp-line" d="M620 500v56M620 580v56"/>
    <rect class="fp-tint" x="540" y="512" width="54" height="22" rx="2"/>
    <rect class="fp-tint" x="640" y="512" width="54" height="22" rx="2"/>
    <rect class="fp-tint" x="540" y="602" width="54" height="22" rx="2"/>
    <rect class="fp-tint" x="640" y="602" width="54" height="22" rx="2"/>
    <rect class="fp-solid" x="548" y="460" width="44" height="34" rx="7"/>
    <rect class="fp-solid" x="648" y="460" width="44" height="34" rx="7"/>
    <rect class="fp-solid" x="548" y="642" width="44" height="34" rx="7"/>
    <rect class="fp-solid" x="648" y="642" width="44" height="34" rx="7"/>
    <!-- pod D -->
    <rect class="fp-solid" x="800" y="500" width="200" height="56" rx="3"/>
    <rect class="fp-solid" x="806" y="556" width="188" height="24" rx="2"/>
    <rect class="fp-solid" x="800" y="580" width="200" height="56" rx="3"/>
    <path class="fp-line" d="M900 500v56M900 580v56"/>
    <rect class="fp-tint" x="820" y="512" width="54" height="22" rx="2"/>
    <rect class="fp-tint" x="920" y="512" width="54" height="22" rx="2"/>
    <rect class="fp-tint" x="820" y="602" width="54" height="22" rx="2"/>
    <rect class="fp-tint" x="920" y="602" width="54" height="22" rx="2"/>
    <rect class="fp-solid" x="828" y="460" width="44" height="34" rx="7"/>
    <rect class="fp-solid" x="928" y="460" width="44" height="34" rx="7"/>
    <rect class="fp-solid" x="828" y="642" width="44" height="34" rx="7"/>
    <rect class="fp-solid" x="928" y="642" width="44" height="34" rx="7"/>
    <!-- standup table with stools -->
