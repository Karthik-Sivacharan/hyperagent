<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1490 970" fill="none" role="img" aria-label="Top-down engineering floor plan">
  <title>Engineering floor plan</title>
  <style>
    .fp-wall   { fill: #ffffff; stroke: #1e1e1d; stroke-width: 1.4; }
    .fp-line   { fill: none;    stroke: #1e1e1d; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
    .fp-solid  { fill: #ffffff; stroke: #1e1e1d; stroke-width: 1.2; stroke-linejoin: round; }
    .fp-tint   { fill: #e8e8e2; stroke: #1e1e1d; stroke-width: 1.2; }
    .fp-floor  { fill: transparent; }
    .fp-thin   { fill: none;    stroke: #1e1e1d; stroke-width: 0.9; stroke-linecap: round; }

    /* Optional room highlight. Works on hover when the SVG is inline or embedded
       as an object; in React, set data-active on a .fp-room group instead. */
    .fp-room * { transition: fill .2s cubic-bezier(.4,0,.2,1), stroke .2s cubic-bezier(.4,0,.2,1); }
    .fp-room:hover .fp-floor,     .fp-room[data-active] .fp-floor { fill: #f55d0014; }
    .fp-room:hover .fp-solid,     .fp-room[data-active] .fp-solid,
    .fp-room:hover .fp-line,      .fp-room[data-active] .fp-line,
    .fp-room:hover .fp-thin,      .fp-room[data-active] .fp-thin  { stroke: #f55d00; }
    .fp-room:hover .fp-tint,      .fp-room[data-active] .fp-tint  { fill: #f55d0026; stroke: #f55d00; }
    @media (prefers-reduced-motion: reduce) { .fp-room * { transition: none; } }
  </style>

  <!-- ============ shell ============ -->
  <rect class="fp-wall" x="40" y="26" width="1410" height="914" rx="56"/>
  <rect class="fp-wall" x="58" y="44" width="1374" height="772" rx="40"/>

  <!-- ============ room floors (hover targets) ============ -->
  <g class="fp-room" data-room="design-room">
    <rect class="fp-floor" x="58" y="44" width="372" height="286"/>
    <!-- whiteboard on the side wall -->
    <rect class="fp-tint" x="62" y="92" width="20" height="170"/>
    <path class="fp-thin" d="M72 110v34M68 166l8 18M76 196l-8 14M72 232v24"/>
    <!-- pinned cards -->
    <rect class="fp-solid" x="330" y="56" width="18" height="18" rx="2"/>
    <rect class="fp-solid" x="356" y="56" width="18" height="18" rx="2"/>
    <rect class="fp-solid" x="382" y="56" width="18" height="18" rx="2"/>
    <!-- table -->
    <rect class="fp-solid" x="140" y="150" width="220" height="100" rx="10"/>
    <!-- chairs -->
    <rect class="fp-solid" x="168" y="108" width="48" height="36" rx="7"/>
    <rect class="fp-solid" x="262" y="108" width="48" height="36" rx="7"/>
    <rect class="fp-solid" x="168" y="254" width="48" height="36" rx="7"/>
    <rect class="fp-solid" x="262" y="254" width="48" height="36" rx="7"/>
    <rect class="fp-solid" x="92" y="176" width="40" height="48" rx="7"/>
    <rect class="fp-solid" x="368" y="176" width="40" height="48" rx="7"/>
  </g>

  <g class="fp-room" data-room="hardware-lab">
    <rect class="fp-floor" x="58" y="342" width="372" height="258"/>
    <!-- wall shelf -->
    <rect class="fp-solid" x="140" y="352" width="200" height="20"/>
    <path class="fp-thin" d="M200 352v20M270 352v20"/>
    <!-- bench with test gear -->
    <rect class="fp-solid" x="140" y="396" width="200" height="48" rx="3"/>
    <rect class="fp-tint" x="152" y="404" width="60" height="32" rx="2"/>
    <rect class="fp-tint" x="232" y="404" width="60" height="32" rx="2"/>
