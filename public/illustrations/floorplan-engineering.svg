    <rect class="fp-solid" x="140" y="478" width="200" height="48" rx="3"/>
    <path class="fp-thin" d="M150 526v22M330 526v22M140 502h200"/>
    <!-- stools -->
    <circle class="fp-solid" cx="180" cy="552" r="15"/>
    <circle class="fp-solid" cx="260" cy="552" r="15"/>
    <!-- parts cabinet -->
    <rect class="fp-solid" x="72" y="392" width="46" height="150" rx="2"/>
    <path class="fp-thin" d="M72 430h46M72 468h46M72 506h46"/>
    <!-- cable spool -->
    <circle class="fp-solid" cx="376" cy="500" r="24"/>
    <circle class="fp-solid" cx="376" cy="500" r="9"/>
  </g>

