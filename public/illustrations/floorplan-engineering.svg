    <circle class="fp-solid" cx="1330" cy="470" r="26"/>
    <circle class="fp-solid" cx="1272" cy="470" r="14"/>
    <circle class="fp-solid" cx="1388" cy="470" r="14"/>
  </g>

  <g class="fp-room" data-room="huddle-room">
    <rect class="fp-floor" x="1228" y="532" width="204" height="128"/>
    <rect class="fp-solid" x="1270" y="570" width="120" height="54" rx="6"/>
    <rect class="fp-solid" x="1284" y="540" width="40" height="28" rx="6"/>
    <rect class="fp-solid" x="1336" y="540" width="40" height="28" rx="6"/>
    <rect class="fp-solid" x="1284" y="626" width="40" height="28" rx="6"/>
    <rect class="fp-solid" x="1336" y="626" width="40" height="28" rx="6"/>
    <rect class="fp-tint" x="1240" y="566" width="18" height="60"/>
