    <rect x="120" y="30" width="180" height="14"/>
    <rect x="520" y="30" width="200" height="14"/>
    <rect x="800" y="30" width="200" height="14"/>
    <rect x="1180" y="30" width="200" height="14"/>
  </g>

  <!-- ============ entrance band ============ -->
  <g>
    <rect class="fp-tint" x="150" y="862" width="196" height="24"/>
    <rect class="fp-tint" x="1150" y="862" width="196" height="24"/>
    <rect class="fp-wall" x="782" y="848" width="82" height="82"/>
  </g>
</svg>
