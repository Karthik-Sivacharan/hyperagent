  <!-- ============ interior walls ============ -->
  <g class="fp-wall">
    <!-- left column: outer wall of the lab stack, with three doors -->
    <rect x="430" y="44" width="12" height="156"/>
    <rect x="430" y="260" width="12" height="190"/>
    <rect x="430" y="510" width="12" height="180"/>
    <rect x="430" y="750" width="12" height="66"/>
    <!-- left column dividers -->
    <rect x="58" y="330" width="384" height="12"/>
    <rect x="58" y="600" width="384" height="12"/>
    <!-- right cluster: corridor wall, with doors to the war room, the booth corridor and the lounge -->
    <rect x="1124" y="44" width="12" height="106"/>
    <rect x="1124" y="210" width="12" height="170"/>
    <rect x="1124" y="440" width="12" height="280"/>
    <rect x="1124" y="780" width="12" height="36"/>
    <!-- right cluster dividers -->
    <rect x="1136" y="300" width="296" height="12"/>
    <rect x="1136" y="672" width="296" height="12"/>
    <!-- booth corridor wall, with a door per booth -->
    <rect x="1216" y="312" width="12" height="40"/>
    <rect x="1216" y="392" width="12" height="70"/>
    <rect x="1216" y="502" width="12" height="70"/>
    <rect x="1216" y="612" width="12" height="60"/>
    <!-- booth dividers -->
