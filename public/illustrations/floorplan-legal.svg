    <rect class="fp-solid" x="1172" y="70" width="34" height="124"/>
    <path class="fp-thin" d="M1176 80h26M1176 92h26M1176 104h26M1176 116h26M1176 128h26M1176 140h26M1176 152h26M1176 164h26M1176 176h26M1176 188h26"/>
