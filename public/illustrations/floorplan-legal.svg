    <rect class="fp-tint" x="272" y="62" width="9" height="26"/>
    <!-- shelving along the side wall -->
    <rect class="fp-solid" x="72" y="140" width="46" height="160"/>
    <path class="fp-thin" d="M76 150h38M76 162h38M76 174h38M76 186h38M76 198h38M76 210h38M76 222h38M76 234h38M76 246h38M76 258h38M76 270h38M76 282h38M76 294h38"/>
    <rect class="fp-tint" x="76" y="216" width="38" height="10"/>
    <!-- long reading table -->
    <rect class="fp-solid" x="190" y="170" width="270" height="78" rx="6"/>
    <path class="fp-thin" d="M204 248v20M446 248v20"/>
    <rect class="fp-solid" x="230" y="126" width="54" height="38" rx="7"/>
    <rect class="fp-solid" x="305" y="126" width="54" height="38" rx="7"/>
    <rect class="fp-solid" x="380" y="126" width="54" height="38" rx="7"/>
    <rect class="fp-solid" x="230" y="254" width="54" height="38" rx="7"/>
    <rect class="fp-solid" x="305" y="254" width="54" height="38" rx="7"/>
    <rect class="fp-solid" x="380" y="254" width="54" height="38" rx="7"/>
    <!-- map / atlas cabinet -->
    <rect class="fp-solid" x="505" y="150" width="64" height="120" rx="2"/>
    <path class="fp-thin" d="M505 174h64M505 198h64M505 222h64M505 246h64"/>
  </g>

