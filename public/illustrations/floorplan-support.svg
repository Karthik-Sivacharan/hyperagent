<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1490 970" fill="none" role="img" aria-label="Top-down support centre floor plan">
  <title>Support centre floor plan</title>
  <style>
    .fp-wall   { fill: #ffffff; stroke: #1e1e1d; stroke-width: 1.4; }
    .fp-line   { fill: none;    stroke: #1e1e1d; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
    .fp-solid  { fill: #ffffff; stroke: #1e1e1d; stroke-width: 1.2; stroke-linejoin: round; }
    .fp-tint   { fill: #e8e8e2; stroke: #1e1e1d; stroke-width: 1.2; }
    .fp-floor  { fill: transparent; }
    .fp-thin   { fill: none;    stroke: #1e1e1d; stroke-width: 0.9; stroke-linecap: round; }

    /* Optional room highlight. Works on hover when the SVG is inline or embedded
       as an object; in React, set data-active on a .fp-room group instead. */
    .fp-room * { transition: fill .2s cubic-bezier(.4,0,.2,1), stroke .2s cubic-bezier(.4,0,.2,1); }
    .fp-room:hover .fp-floor,     .fp-room[data-active] .fp-floor { fill: #f55d0014; }
    .fp-room:hover .fp-solid,     .fp-room[data-active] .fp-solid,
    .fp-room:hover .fp-line,      .fp-room[data-active] .fp-line,
    .fp-room:hover .fp-thin,      .fp-room[data-active] .fp-thin  { stroke: #f55d00; }
    .fp-room:hover .fp-tint,      .fp-room[data-active] .fp-tint  { fill: #f55d0026; stroke: #f55d00; }
    @media (prefers-reduced-motion: reduce) { .fp-room * { transition: none; } }
  </style>

  <!-- ============ shell ============ -->
  <rect class="fp-wall" x="40" y="26" width="1410" height="914" rx="56"/>
  <rect class="fp-wall" x="58" y="44" width="1374" height="772" rx="40"/>

  <!-- ============ rooms ============ -->
  <g class="fp-room" data-room="call-booths">
    <rect class="fp-floor" x="58" y="44" width="254" height="772"/>
    <!-- booth 1 -->
    <rect class="fp-tint"  x="120" y="80"  width="84" height="24" rx="2"/>
    <rect class="fp-solid" x="92"  y="120" width="140" height="44" rx="3"/>
    <circle class="fp-solid" cx="162" cy="196" r="16"/>
    <!-- booth 2 -->
    <rect class="fp-tint"  x="120" y="272" width="84" height="24" rx="2"/>
    <rect class="fp-solid" x="92"  y="312" width="140" height="44" rx="3"/>
    <circle class="fp-solid" cx="162" cy="388" r="16"/>
    <!-- booth 3 -->
    <rect class="fp-tint"  x="120" y="464" width="84" height="24" rx="2"/>
    <rect class="fp-solid" x="92"  y="504" width="140" height="44" rx="3"/>
    <circle class="fp-solid" cx="162" cy="580" r="16"/>
    <!-- booth 4 -->
    <rect class="fp-tint"  x="120" y="656" width="84" height="24" rx="2"/>
    <rect class="fp-solid" x="92"  y="696" width="140" height="44" rx="3"/>
    <circle class="fp-solid" cx="162" cy="772" r="16"/>
  </g>

  <g class="fp-room" data-room="support-floor">
    <rect class="fp-floor" x="324" y="44" width="676" height="556"/>
    <!-- row 1 -->
    <rect class="fp-solid" x="360" y="92"  width="110" height="50" rx="3"/><rect class="fp-tint" x="384" y="70" width="62" height="20" rx="2"/><rect class="fp-solid" x="392" y="150" width="46" height="34" rx="7"/>
    <rect class="fp-solid" x="510" y="92"  width="110" height="50" rx="3"/><rect class="fp-tint" x="534" y="70" width="62" height="20" rx="2"/><rect class="fp-solid" x="542" y="150" width="46" height="34" rx="7"/>
    <rect class="fp-solid" x="660" y="92"  width="110" height="50" rx="3"/><rect class="fp-tint" x="684" y="70" width="62" height="20" rx="2"/><rect class="fp-solid" x="692" y="150" width="46" height="34" rx="7"/>
    <rect class="fp-solid" x="810" y="92"  width="110" height="50" rx="3"/><rect class="fp-tint" x="834" y="70" width="62" height="20" rx="2"/><rect class="fp-solid" x="842" y="150" width="46" height="34" rx="7"/>
    <!-- row 2 -->
    <rect class="fp-solid" x="360" y="214" width="110" height="50" rx="3"/><rect class="fp-tint" x="384" y="192" width="62" height="20" rx="2"/><rect class="fp-solid" x="392" y="272" width="46" height="34" rx="7"/>
    <rect class="fp-solid" x="510" y="214" width="110" height="50" rx="3"/><rect class="fp-tint" x="534" y="192" width="62" height="20" rx="2"/><rect class="fp-solid" x="542" y="272" width="46" height="34" rx="7"/>
    <rect class="fp-solid" x="660" y="214" width="110" height="50" rx="3"/><rect class="fp-tint" x="684" y="192" width="62" height="20" rx="2"/><rect class="fp-solid" x="692" y="272" width="46" height="34" rx="7"/>
    <rect class="fp-solid" x="810" y="214" width="110" height="50" rx="3"/><rect class="fp-tint" x="834" y="192" width="62" height="20" rx="2"/><rect class="fp-solid" x="842" y="272" width="46" height="34" rx="7"/>
    <!-- row 3 -->
    <rect class="fp-solid" x="360" y="336" width="110" height="50" rx="3"/><rect class="fp-tint" x="384" y="314" width="62" height="20" rx="2"/><rect class="fp-solid" x="392" y="394" width="46" height="34" rx="7"/>
    <rect class="fp-solid" x="510" y="336" width="110" height="50" rx="3"/><rect class="fp-tint" x="534" y="314" width="62" height="20" rx="2"/><rect class="fp-solid" x="542" y="394" width="46" height="34" rx="7"/>
    <rect class="fp-solid" x="660" y="336" width="110" height="50" rx="3"/><rect class="fp-tint" x="684" y="314" width="62" height="20" rx="2"/><rect class="fp-solid" x="692" y="394" width="46" height="34" rx="7"/>
    <rect class="fp-solid" x="810" y="336" width="110" height="50" rx="3"/><rect class="fp-tint" x="834" y="314" width="62" height="20" rx="2"/><rect class="fp-solid" x="842" y="394" width="46" height="34" rx="7"/>
    <!-- row 4 -->
    <rect class="fp-solid" x="360" y="458" width="110" height="50" rx="3"/><rect class="fp-tint" x="384" y="436" width="62" height="20" rx="2"/><rect class="fp-solid" x="392" y="516" width="46" height="34" rx="7"/>
    <rect class="fp-solid" x="510" y="458" width="110" height="50" rx="3"/><rect class="fp-tint" x="534" y="436" width="62" height="20" rx="2"/><rect class="fp-solid" x="542" y="516" width="46" height="34" rx="7"/>
    <rect class="fp-solid" x="660" y="458" width="110" height="50" rx="3"/><rect class="fp-tint" x="684" y="436" width="62" height="20" rx="2"/><rect class="fp-solid" x="692" y="516" width="46" height="34" rx="7"/>
    <rect class="fp-solid" x="810" y="458" width="110" height="50" rx="3"/><rect class="fp-tint" x="834" y="436" width="62" height="20" rx="2"/><rect class="fp-solid" x="842" y="516" width="46" height="34" rx="7"/>
  </g>

  <g class="fp-room" data-room="break-room">
