    <!-- wall screens -->
    <rect class="fp-tint" x="700" y="630" width="112" height="34" rx="2"/>
    <rect class="fp-tint" x="830" y="630" width="112" height="34" rx="2"/>
    <!-- table -->
    <rect class="fp-solid" x="704" y="694" width="234" height="66" rx="8"/>
    <!-- chairs -->
    <rect class="fp-solid" x="726" y="654" width="46" height="34" rx="7"/>
    <rect class="fp-solid" x="796" y="654" width="46" height="34" rx="7"/>
    <rect class="fp-solid" x="866" y="654" width="46" height="34" rx="7"/>
    <rect class="fp-solid" x="726" y="766" width="46" height="34" rx="7"/>
    <rect class="fp-solid" x="796" y="766" width="46" height="34" rx="7"/>
    <rect class="fp-solid" x="866" y="766" width="46" height="34" rx="7"/>
  </g>

  <g class="fp-room" data-room="qa-room">
    <rect class="fp-floor" x="1012" y="44" width="420" height="236"/>
    <rect class="fp-tint"  x="1078" y="86"  width="104" height="28" rx="2"/>
    <rect class="fp-solid" x="1060" y="124" width="140" height="50" rx="3"/>
    <circle class="fp-solid" cx="1130" cy="202" r="16"/>
    <rect class="fp-tint"  x="1258" y="86"  width="104" height="28" rx="2"/>
    <rect class="fp-solid" x="1240" y="124" width="140" height="50" rx="3"/>
    <circle class="fp-solid" cx="1310" cy="202" r="16"/>
    <path class="fp-thin" d="M1220 70v190"/>
  </g>

  <g class="fp-room" data-room="training-room">
    <rect class="fp-floor" x="1012" y="292" width="420" height="268"/>
    <rect class="fp-tint"  x="1084" y="306" width="264" height="30" rx="2"/>
    <rect class="fp-solid" x="1162" y="352" width="118" height="44" rx="3"/>
    <rect class="fp-solid" x="1060" y="424" width="56" height="38" rx="7"/>
    <rect class="fp-solid" x="1136" y="424" width="56" height="38" rx="7"/>
    <rect class="fp-solid" x="1212" y="424" width="56" height="38" rx="7"/>
    <rect class="fp-solid" x="1288" y="424" width="56" height="38" rx="7"/>
    <rect class="fp-solid" x="1060" y="492" width="56" height="38" rx="7"/>
    <rect class="fp-solid" x="1136" y="492" width="56" height="38" rx="7"/>
    <rect class="fp-solid" x="1212" y="492" width="56" height="38" rx="7"/>
    <rect class="fp-solid" x="1288" y="492" width="56" height="38" rx="7"/>
