  <g class="fp-room" data-room="lead-office">
    <rect class="fp-floor" x="1012" y="572" width="420" height="244"/>
    <rect class="fp-solid" x="1124" y="664" width="156" height="54" rx="3"/>
    <path class="fp-thin" d="M1134 718v26M1270 718v26"/>
    <rect class="fp-solid" x="1176" y="616" width="52" height="42" rx="8"/>
    <rect class="fp-solid" x="1124" y="732" width="48" height="40" rx="8"/>
    <rect class="fp-solid" x="1224" y="732" width="48" height="40" rx="8"/>
    <rect class="fp-solid" x="1024" y="644" width="34" height="92" rx="2"/>
    <path class="fp-thin" d="M1024 675h34M1024 706h34"/>
  </g>

  <!-- ============ interior walls ============ -->
  <g class="fp-wall">
    <!-- booth bank -->
    <rect x="312" y="44"  width="12" height="106"/>
    <rect x="312" y="200" width="12" height="142"/>
    <rect x="312" y="392" width="12" height="142"/>
    <rect x="312" y="584" width="12" height="142"/>
    <rect x="312" y="776" width="12" height="40"/>
    <rect x="58" y="236" width="266" height="12"/>
    <rect x="58" y="428" width="266" height="12"/>
    <rect x="58" y="620" width="266" height="12"/>
    <!-- centre / right divider -->
    <rect x="1000" y="44"  width="12" height="180"/>
    <rect x="1000" y="280" width="12" height="120"/>
    <rect x="1000" y="460" width="12" height="140"/>
    <rect x="1000" y="660" width="12" height="156"/>
    <!-- right column -->
    <rect x="1012" y="280" width="420" height="12"/>
    <rect x="1012" y="560" width="420" height="12"/>
    <!-- centre bottom rooms -->
    <rect x="324" y="600" width="180" height="12"/>
    <rect x="560" y="600" width="150" height="12"/>
    <rect x="780" y="600" width="232" height="12"/>
    <rect x="660" y="612" width="12" height="204"/>
  </g>

  <!-- ============ windows in the outer wall ============ -->
  <g class="fp-tint">
    <rect x="140" y="30" width="120" height="14"/>
    <rect x="380" y="30" width="240" height="14"/>
    <rect x="700" y="30" width="200" height="14"/>
    <rect x="1080" y="30" width="240" height="14"/>
  </g>

  <!-- ============ entrance band ============ -->
  <g>
    <rect class="fp-tint" x="150" y="862" width="196" height="24"/>
    <rect class="fp-tint" x="1150" y="862" width="196" height="24"/>
    <rect class="fp-wall" x="782" y="848" width="82" height="82"/>
  </g>
</svg>
