    <circle class="fp-thin" cx="396" cy="657" r="11"/>
    <path class="fp-thin" d="M460 636v42"/>
    <!-- sofa -->
    <rect class="fp-solid" x="344" y="726" width="164" height="58" rx="18"/>
    <path class="fp-thin" d="M366 736h120M426 736v48"/>
    <!-- round table + stools -->
    <circle class="fp-solid" cx="588" cy="716" r="36"/>
    <circle class="fp-solid" cx="588" cy="660" r="15"/>
    <circle class="fp-solid" cx="588" cy="772" r="15"/>
  </g>

  <g class="fp-room" data-room="escalation-room">
