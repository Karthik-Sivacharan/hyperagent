<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1490 970" fill="none" role="img" aria-label="Top-down clinic floor plan">
  <title>Clinic floor plan</title>
  <style>
    .fp-wall   { fill: #ffffff; stroke: #1e1e1d; stroke-width: 1.4; }
    .fp-line   { fill: none;    stroke: #1e1e1d; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
    .fp-solid  { fill: #ffffff; stroke: #1e1e1d; stroke-width: 1.2; stroke-linejoin: round; }
    .fp-tint   { fill: #e8e8e2; stroke: #1e1e1d; stroke-width: 1.2; }
    .fp-floor  { fill: transparent; }
    .fp-thin   { fill: none;    stroke: #1e1e1d; stroke-width: 0.9; stroke-linecap: round; }

    /* Optional room highlight. Works on hover when the SVG is inline or embedded
       as an object; in React, set data-active on a .fp-room group instead. */
    .fp-room * { transition: fill .2s cubic-bezier(.4,0,.2,1), stroke .2s cubic-bezier(.4,0,.2,1); }
    .fp-room:hover .fp-floor,     .fp-room[data-active] .fp-floor { fill: #f55d0014; }
    .fp-room:hover .fp-solid,     .fp-room[data-active] .fp-solid,
    .fp-room:hover .fp-line,      .fp-room[data-active] .fp-line,
    .fp-room:hover .fp-thin,      .fp-room[data-active] .fp-thin  { stroke: #f55d00; }
    .fp-room:hover .fp-tint,      .fp-room[data-active] .fp-tint  { fill: #f55d0026; stroke: #f55d00; }
    @media (prefers-reduced-motion: reduce) { .fp-room * { transition: none; } }
  </style>

  <!-- ============ shell ============ -->
  <rect class="fp-wall" x="40" y="26" width="1410" height="914" rx="56"/>
  <rect class="fp-wall" x="58" y="44" width="1374" height="772" rx="40"/>

  <!-- ============ rooms ============ -->
  <g class="fp-room" data-room="waiting">
    <rect class="fp-floor" x="58" y="44" width="412" height="386"/>
    <!-- reception counter, L shaped -->
    <rect class="fp-solid" x="92" y="84" width="240" height="44" rx="6"/>
    <rect class="fp-solid" x="92" y="128" width="44" height="86" rx="6"/>
    <rect class="fp-solid" x="152" y="146" width="46" height="38" rx="7"/>
    <!-- waiting chairs -->
    <rect class="fp-solid" x="110" y="250" width="46" height="40" rx="8"/>
    <rect class="fp-solid" x="170" y="250" width="46" height="40" rx="8"/>
    <rect class="fp-solid" x="230" y="250" width="46" height="40" rx="8"/>
    <rect class="fp-solid" x="290" y="250" width="46" height="40" rx="8"/>
    <rect class="fp-solid" x="110" y="330" width="46" height="40" rx="8"/>
    <rect class="fp-solid" x="170" y="330" width="46" height="40" rx="8"/>
    <rect class="fp-solid" x="230" y="330" width="46" height="40" rx="8"/>
    <rect class="fp-solid" x="290" y="330" width="46" height="40" rx="8"/>
    <!-- low table -->
    <rect class="fp-solid" x="356" y="288" width="74" height="54" rx="6"/>
    <path class="fp-thin" d="M368 300h50M368 312h36"/>
    <!-- plant -->
    <path class="fp-line" d="M382 152h42l-6-40h-30z"/>
    <path class="fp-line" d="M403 112c-7-16-6-30-1-40M403 112c9-14 19-20 30-21M403 112c-10-9-20-12-30-11"/>
  </g>

  <g class="fp-room" data-room="pharmacy">
    <rect class="fp-floor" x="58" y="442" width="412" height="374"/>
    <rect class="fp-solid" x="92" y="490" width="300" height="36"/>
    <rect class="fp-solid" x="92" y="566" width="300" height="36"/>
    <rect class="fp-solid" x="92" y="642" width="300" height="36"/>
    <path class="fp-thin" d="M152 490v36M212 490v36M272 490v36M332 490v36M152 566v36M212 566v36M272 566v36M332 566v36M152 642v36M212 642v36M272 642v36M332 642v36"/>
    <rect class="fp-tint" x="212" y="566" width="60" height="36"/>
    <!-- dispensing counter -->
    <rect class="fp-solid" x="92" y="722" width="300" height="46" rx="4"/>
    <path class="fp-thin" d="M92 744h300"/>
    <circle class="fp-solid" cx="424" cy="744" r="16"/>
  </g>

  <g class="fp-room" data-room="nurses-station">
    <rect class="fp-floor" x="542" y="44" width="438" height="256"/>
    <!-- curved counter -->
    <path class="fp-solid" d="M636 238v-32a114 66 0 0 1 228 0v32z"/>
    <path class="fp-thin" d="M654 238v-30a96 52 0 0 1 192 0v30"/>
    <rect class="fp-tint" x="686" y="176" width="44" height="24" rx="2"/>
    <rect class="fp-tint" x="770" y="176" width="44" height="24" rx="2"/>
    <!-- supply cart -->
    <rect class="fp-solid" x="572" y="88" width="64" height="48" rx="3"/>
    <path class="fp-thin" d="M572 104h64M572 120h64"/>
    <!-- wall cabinets -->
    <rect class="fp-solid" x="858" y="70" width="104" height="34"/>
    <path class="fp-thin" d="M892 70v34M927 70v34"/>
  </g>

  <g class="fp-room" data-room="exam-1">
    <rect class="fp-floor" x="542" y="310" width="218" height="250"/>
    <rect class="fp-solid" x="566" y="398" width="150" height="56" rx="8"/>
    <rect class="fp-solid" x="574" y="406" width="34" height="40" rx="4"/>
    <circle class="fp-solid" cx="600" cy="490" r="15"/>
    <rect class="fp-solid" x="698" y="330" width="46" height="44" rx="2"/>
    <path class="fp-thin" d="M698 352h46"/>
    <rect class="fp-solid" x="558" y="330" width="46" height="32" rx="5"/>
    <circle class="fp-thin" cx="581" cy="346" r="6"/>
  </g>

  <g class="fp-room" data-room="exam-2">
    <rect class="fp-floor" x="772" y="310" width="208" height="250"/>
    <rect class="fp-solid" x="796" y="398" width="150" height="56" rx="8"/>
    <rect class="fp-solid" x="904" y="406" width="34" height="40" rx="4"/>
    <circle class="fp-solid" cx="912" cy="490" r="15"/>
    <rect class="fp-solid" x="790" y="330" width="46" height="44" rx="2"/>
    <path class="fp-thin" d="M790 352h46"/>
    <rect class="fp-solid" x="928" y="330" width="46" height="32" rx="5"/>
    <circle class="fp-thin" cx="951" cy="346" r="6"/>
  </g>

  <g class="fp-room" data-room="exam-3">
    <rect class="fp-floor" x="542" y="572" width="218" height="244"/>
    <rect class="fp-solid" x="566" y="654" width="150" height="56" rx="8"/>
    <rect class="fp-solid" x="574" y="662" width="34" height="40" rx="4"/>
    <circle class="fp-solid" cx="600" cy="746" r="15"/>
    <rect class="fp-solid" x="698" y="592" width="46" height="44" rx="2"/>
    <path class="fp-thin" d="M698 614h46"/>
    <rect class="fp-solid" x="558" y="592" width="46" height="32" rx="5"/>
    <circle class="fp-thin" cx="581" cy="608" r="6"/>
  </g>

  <g class="fp-room" data-room="lab">
    <rect class="fp-floor" x="772" y="572" width="208" height="244"/>
    <!-- wall shelf -->
    <rect class="fp-solid" x="796" y="592" width="160" height="22"/>
    <path class="fp-thin" d="M840 592v22M896 592v22"/>
    <!-- bench -->
    <rect class="fp-solid" x="796" y="648" width="160" height="48" rx="3"/>
    <path class="fp-thin" d="M806 696v26M946 696v26"/>
    <!-- microscope -->
    <rect class="fp-solid" x="808" y="626" width="26" height="22" rx="3"/>
    <circle class="fp-solid" cx="821" cy="628" r="8"/>
    <!-- samples -->
    <circle class="fp-thin" cx="876" cy="672" r="7"/>
    <circle class="fp-thin" cx="898" cy="672" r="7"/>
    <circle class="fp-thin" cx="920" cy="672" r="7"/>
    <circle class="fp-solid" cx="930" cy="742" r="15"/>
  </g>

  <g class="fp-room" data-room="imaging">
    <rect class="fp-floor" x="992" y="44" width="440" height="296"/>
    <!-- scanner: gantry with a bore -->
    <rect class="fp-solid" x="1096" y="104" width="210" height="170" rx="26"/>
    <circle class="fp-solid" cx="1201" cy="189" r="64"/>
    <circle class="fp-solid" cx="1201" cy="189" r="38"/>
    <rect class="fp-solid" x="1201" y="176" width="152" height="26" rx="4"/>
    <!-- control desk -->
    <rect class="fp-solid" x="1330" y="88" width="82" height="56" rx="3"/>
    <rect class="fp-tint" x="1344" y="98" width="54" height="24" rx="2"/>
    <circle class="fp-solid" cx="1371" cy="252" r="15"/>
    <!-- lead screen -->
    <rect class="fp-solid" x="1020" y="250" width="56" height="70" rx="3"/>
    <path class="fp-thin" d="M1020 285h56"/>
  </g>

  <g class="fp-room" data-room="ward">
    <rect class="fp-floor" x="992" y="350" width="440" height="250"/>
    <rect class="fp-solid" x="1020" y="436" width="112" height="52" rx="8"/>
    <rect class="fp-solid" x="1026" y="444" width="26" height="36" rx="4"/>
    <rect class="fp-solid" x="1160" y="436" width="112" height="52" rx="8"/>
    <rect class="fp-solid" x="1166" y="444" width="26" height="36" rx="4"/>
    <rect class="fp-solid" x="1300" y="436" width="112" height="52" rx="8"/>
    <rect class="fp-solid" x="1306" y="444" width="26" height="36" rx="4"/>
    <!-- curtain rails -->
    <path class="fp-thin" d="M1014 428a62 62 0 0 1 124 0M1154 428a62 62 0 0 1 124 0M1294 428a62 62 0 0 1 124 0"/>
    <!-- bedside tables -->
    <rect class="fp-solid" x="1138" y="500" width="18" height="24" rx="2"/>
    <rect class="fp-solid" x="1278" y="500" width="18" height="24" rx="2"/>
  </g>

  <g class="fp-room" data-room="consult">
    <rect class="fp-floor" x="992" y="610" width="440" height="206"/>
    <rect class="fp-solid" x="1120" y="686" width="160" height="56" rx="3"/>
    <path class="fp-thin" d="M1130 742v26M1270 742v26"/>
    <rect class="fp-solid" x="1174" y="636" width="52" height="42" rx="8"/>
    <rect class="fp-solid" x="1128" y="756" width="48" height="42" rx="8"/>
    <rect class="fp-solid" x="1228" y="756" width="48" height="42" rx="8"/>
    <rect class="fp-solid" x="1004" y="650" width="34" height="96" rx="2"/>
    <path class="fp-thin" d="M1004 682h34M1004 714h34"/>
  </g>

  <!-- ============ interior walls ============ -->
  <g class="fp-wall">
    <!-- verticals -->
    <rect x="470" y="44" width="12" height="156"/>
    <rect x="470" y="260" width="12" height="300"/>
    <rect x="470" y="620" width="12" height="196"/>
    <rect x="530" y="44" width="12" height="106"/>
    <rect x="530" y="210" width="12" height="170"/>
    <rect x="530" y="430" width="12" height="210"/>
    <rect x="530" y="690" width="12" height="126"/>
    <rect x="760" y="310" width="12" height="250"/>
    <rect x="760" y="572" width="12" height="244"/>
    <rect x="980" y="44" width="12" height="106"/>
    <rect x="980" y="200" width="12" height="230"/>
    <rect x="980" y="480" width="12" height="200"/>
    <rect x="980" y="730" width="12" height="86"/>
    <!-- horizontals -->
    <rect x="58" y="430" width="180" height="12"/>
    <rect x="286" y="430" width="196" height="12"/>
    <rect x="530" y="300" width="192" height="12"/>
    <rect x="770" y="300" width="222" height="12"/>
    <rect x="530" y="560" width="462" height="12"/>
    <rect x="992" y="340" width="440" height="12"/>
    <rect x="992" y="600" width="440" height="12"/>
  </g>

  <!-- ============ windows in the outer wall ============ -->
  <g class="fp-tint">
    <rect x="140" y="30" width="180" height="14"/>
    <rect x="360" y="30" width="90" height="14"/>
    <rect x="600" y="30" width="150" height="14"/>
    <rect x="1060" y="30" width="200" height="14"/>
    <rect x="1290" y="30" width="120" height="14"/>
  </g>

  <!-- ============ entrance band ============ -->
  <g>
    <rect class="fp-tint" x="150" y="862" width="196" height="24"/>
    <rect class="fp-tint" x="1150" y="862" width="196" height="24"/>
    <rect class="fp-wall" x="782" y="848" width="82" height="82"/>
  </g>
</svg>
